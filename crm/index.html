<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Holy Intelligence CRM</title>
<link rel="icon" type="image/svg+xml" href="/assets/holy-coroa.svg">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#faf9f6}
body{overflow:hidden}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:#c8cfc0;border-radius:4px}
input,select,textarea{font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:#4a5c2f!important;box-shadow:0 0 0 2px rgba(74,92,47,.1)!important}
#ld{position:fixed;inset:0;background:#1a1c18;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .5s}
.ll{width:170px;height:auto;display:block;margin-bottom:18px}
.ls{font-size:11px;letter-spacing:.22em;color:#8fa060;text-transform:uppercase;margin-bottom:40px}
.lb{width:180px;height:2px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden}
.lf{height:100%;background:#4a5c2f;border-radius:2px;animation:lda 1.5s ease forwards}
@keyframes lda{0%{width:5%}100%{width:95%}}
</style>
<style id="holy-mobile">
@media (max-width: 820px){
  .mk-grid{grid-template-columns:1fr !important}
  /* evita o zoom automático do iPhone ao tocar num campo */
  input, select, textarea { font-size: 16px !important; }
  /* formulários e colunas lado a lado viram uma coluna */
  [style*="grid-template-columns: 1fr 1fr"],
  [style*="grid-template-columns: 250px 1fr"] { grid-template-columns: minmax(0, 1fr) !important; }
  /* cartões de números: duas colunas */
  [style*="grid-template-columns: 1fr 1fr 1fr 1fr"],
  [style*="grid-template-columns: repeat(5, 1fr)"],
  [style*="grid-template-columns: repeat(4, 1fr)"],
  [style*="grid-template-columns: repeat(3, 1fr)"] { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
  [style*="grid-template-columns: 56px 1fr 1fr"] { grid-template-columns: 56px minmax(0, 1fr) !important; }
  /* janelas (cadastros) ocupam a tela toda com respiro menor */
  [style*="margin: 24px auto"] { padding: 18px 16px !important; margin: 0 auto !important; border-radius: 14px !important; }
  [style*="z-index: 2000"][style*="padding: 16px"] { padding: 8px !important; }
  /* barras de busca e filtros quebram linha em vez de vazar */
  div:has(> input[placeholder*="🔍"]) { flex-wrap: wrap !important; }
  input[placeholder*="🔍"] { flex: 1 1 100% !important; min-width: 0 !important; }
  /* funil: colunas largas, uma por tela, deslizando para o lado */
  [style*="flex: 0 0 186px"] { flex: 0 0 82vw !important; scroll-snap-align: start; }
  div:has(> [style*="flex: 0 0 186px"]) { scroll-snap-type: x mandatory; }
  /* nada passa da largura da tela */
  img, video, iframe { max-width: 100%; }
  #hly-site { max-width: 46vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
}
</style>

<meta name="theme-color" content="#1a1c18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Holy CRM">
</head>
<body>
<div id="ld">
  <img class="ll" src="/assets/holy-logo-claro.svg" alt="Holy Curadoria Imobiliária">
  <div class="ls">Intelligence CRM · Chapecó-SC</div>
  <div class="lb"><div class="lf"></div></div>
</div>

function VozPage({ onAddIm, onAddCli, setPage }) {
  const [status, setStatus] = React.useState('idle'); // idle | listening | processing | done | error
  const [transcript, setTranscript] = React.useState('');
  const [result, setResult] = React.useState(null);
  const [saved, setSaved] = React.useState(false);
  const [editData, setEditData] = React.useState(null);
  const recRef = React.useRef(null);

  const isSupported = typeof window !== 'undefined' &&
    ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window);

  function startListening() {
    if (!isSupported) { setStatus('error'); return; }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const rec = new SR();
    rec.lang = 'pt-BR';
    rec.continuous = false;
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    recRef.current = rec;

    rec.onstart = () => { setStatus('listening'); setTranscript(''); setResult(null); setSaved(false); };
    rec.onresult = (e) => {
      const text = e.results[0][0].transcript;
      setTranscript(text);
      setStatus('processing');
      processVoice(text);
    };
    rec.onerror = (e) => { setStatus('error'); setTranscript('Erro: ' + e.error); };
    rec.onend = () => { if (status === 'listening') setStatus('idle'); };
    rec.start();
  }

  function stopListening() {
    if (recRef.current) recRef.current.stop();
    setStatus('idle');
  }

  async function processVoice(text) {
    var apiKey = '';
    try { apiKey = localStorage.getItem('hly_anthropic_key') || 'nuvem'; } catch(e) { apiKey = 'nuvem'; }
    if (!apiKey) {
      setStatus('error');
      setTranscript('Configure sua Chave Anthropic em ⚙️ Configurações primeiro.');
      return;
    }

    const prompt = `Você é um assistente de CRM imobiliário brasileiro. Analise o comando de voz abaixo e extraia os dados para cadastro.

COMANDO: "${text}"

Identifique se é um:
- IMOVEL: apartamento, casa, terreno, sala, cobertura, studio
- CLIENTE: cliente, comprador, interessado, lead
- PROPRIETARIO: proprietário, dono, vendedor (cadastra como imóvel com dados do proprietário)

Responda APENAS com JSON válido no formato:
Para IMOVEL:
{"tipo":"imovel","dados":{"nome":"","tipo":"Apartamento","cidade":"","bairro":"","rua":"","numero":"","area":0,"quartos":0,"suites":0,"banheiros":0,"vagas":0,"valor":0,"condominio":0,"iptu":0,"status":"Disponível","finalidade":"Venda","descricao":"","proprietario":"","proprietarioTel":"","proprietarioEmail":""}}

Para CLIENTE:
{"tipo":"cliente","dados":{"nome":"","celular":"","email":"","cidade":"","bairro":"","obs":"","stage":"Prospecção","tipoImovel":"","valorMin":0,"valorMax":0,"quartos":0,"vagas":0}}

Regras:
- Extraia todos os dados mencionados
- Valores monetários: "650 mil" = 650000, "1,2 milhão" = 1200000
- Se não mencionar cidade, use "Chapecó-SC"
- nome do imóvel: crie um nome descritivo (ex: "Apto 3Q Efapi")
- Responda SOMENTE o JSON, sem explicação`;

    try {
      const proxyUrl = '/api/ia';
      let texto = '';
      try {
        const r = await fetch(proxyUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Admin-Key': HolyAuth.get() },
          body: JSON.stringify({ apiKey, msg: prompt, max: 800, system: 'Você extrai dados de comandos de voz para CRM imobiliário. Responda APENAS JSON.' })
        });
        const d = await r.json();
        texto = d.text || '';
        if (!texto) throw Object.assign(new Error(d.error || 'IA sem resposta'), { holy: 1 });
      } catch(_) {
        if (_ && _.holy) throw _;
        // fallback direto
        const r2 = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-api-key': apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-allow-browser': 'true' },
          body: JSON.stringify({ model: 'claude-sonnet-4-5', max_tokens: 800, messages: [{ role: 'user', content: prompt }] })
        });
        const d2 = await r2.json();
        texto = (d2.content || []).map(c => c.text || '').join('');
      }

      // Parse JSON
      const clean = texto.replace(/```json/g,'').replace(/```/g,'').trim();
      const parsed = JSON.parse(clean);
      setResult(parsed);
      setEditData({ ...parsed.dados });
      setStatus('done');
    } catch(err) {
      setStatus('error');
      setTranscript('Erro ao processar: ' + err.message);
    }
  }

  function handleSave() {
    if (!result || !editData) return;
    const id = 'id_' + Date.now();

      onAddIm({ ...editData, id, createdAt: new Date().toISOString() });
    } else {

    }

    setTimeout(() => {
      setPage(result.tipo === 'imovel' ? 'imoveis' : 'clientes');
    }, 1200);
  }

  function reset() {
    setStatus('idle'); setTranscript(''); setResult(null); setSaved(false); setEditData(null);
  }

  const C2 = { olive:'#2d3a1f', oliveMid:'#4a5c2f', gold:'#b8993a', cream:'#f5f3ee', ink:'#1a1c18', muted:'#7a7d72' };

  return React.createElement('div', { style: { padding: '24px 32px', maxWidth: 720, margin: '0 auto' } },
    // Header
    React.createElement('div', { style: { marginBottom: 32 } },
      React.createElement('h2', { style: { fontFamily:"'Cormorant Garamond',serif", fontSize: 26, fontWeight: 700, color: C2.ink, marginBottom: 6 } }, '🎤 Cadastro por Voz'),
      React.createElement('p', { style: { fontSize: 14, color: C2.muted, lineHeight: 1.6 } }, 'Fale naturalmente e a IA extrai os dados automaticamente. Funciona para imóveis, clientes e proprietários.')
